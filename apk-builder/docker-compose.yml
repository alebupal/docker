services:
  apk-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: apk-builder:latest
    container_name: apk_builder
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    volumes:
      - "${WEB_DIR:-../suite-web/www/generarPassword}:/src-web:ro"
      - "${OUTPUT_DIR:-./output}:/output"
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - gradle-cache:/root/.gradle
    environment:
      - APP_NAME=${APP_NAME:-}
      - APP_ID=${APP_ID:-}
      - CI=1

volumes:
  gradle-cache:

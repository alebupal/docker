services:
  gestor-archivos:
    build: ${BUILD_CONTEXT:-../../gestor-archivos}
    pull_policy: build
    container_name: gestor-archivos
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - PORT=${PORT:-8090}
      - DATA_ROOT=/host
      # 0:0 permite leer/mover cualquier directorio del servidor; pon 1000:1000 si prefieres limitarlo
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
    volumes:
      - ${USER_HOME:-.}/config:/config
      - ${HOST_ROOT:-/}:/host


name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash -n y shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          # *.sh versionados + ficheros sin extensión con shebang bash,
          # excepto suite-web/www (código web).
          scripts=() configs=()
          while IFS= read -r f; do
            case "$f" in
              suite-web/www/*) ;;
              # Ficheros de configuración cargados con `source` por update.sh
              # (algunos sin shebang): sus variables se usan fuera.
              */config.sh|config-template.sh) configs+=("$f") ;;
              *.sh) scripts+=("$f") ;;
              */*.*|*.*) ;;
              *) [ -f "$f" ] && head -n1 "$f" | grep -Eq '^#!.*[/ ]bash' && scripts+=("$f") ;;
            esac
          done < <(git ls-files)
          rc=0
          for f in "${scripts[@]}" "${configs[@]}"; do bash -n "$f" || rc=1; done
          echo "== Scripts (${#scripts[@]})"
          if [ "${#scripts[@]}" -gt 0 ]; then
            printf '%s\n' "${scripts[@]}"
            shellcheck -S warning "${scripts[@]}" || rc=1
          fi
          echo "== Configs con source (${#configs[@]})"
          if [ "${#configs[@]}" -gt 0 ]; then
            shellcheck -S warning --shell=bash -e SC2034 "${configs[@]}" || rc=1
          fi
          exit "$rc"

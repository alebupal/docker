upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
date.timezone = Europe/Madrid

; Errores al log del contenedor (docker logs suite_php), nunca en las respuestas: un aviso
; impreso rompe las APIs JSON/imágenes y muestra rutas internas
display_errors = Off
log_errors = On
expose_php = Off

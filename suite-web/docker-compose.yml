services:
  php:
    image: php:8.3-fpm-alpine
    container_name: suite_php
    restart: always
    volumes:
      - ./www:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - suite_net

  nginx:
    image: nginx:alpine
    container_name: suite_nginx
    restart: always
    ports:
      - "${SUITE_PORT:-8080}:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - suite_net

networks:
  suite_net:
    driver: bridge

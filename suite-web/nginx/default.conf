server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Mantener el puerto del host en las redirecciones (evita perder el puerto 8080)
    absolute_redirect off;
    port_in_redirect off;

    # Permitir subidas de carátulas y archivos grandes
    client_max_body_size 128M;

    # Compresión gzip para carga ultrarrápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Detección de IP real si las peticiones pasan por Nginx Proxy Manager
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Redirección por defecto en la raíz hacia la página 404 / portal
    location = / {
        return 302 /404.html;
    }

    # Página de error 404 personalizada
    error_page 404 /404.html;

    # GENERADOR DE CONTRASEÑAS (PROTEGIDO):
    # Si se intenta acceder a través de cualquier dominio público (ej: duckdns.org o proxy exterior),
    # Nginx devuelve 404 inmediato para ocultar y blindar la aplicación.
    # Solo es accesible si accedes directamente por tu IP local (192.168.x.x o localhost).
    location ^~ /generarPassword {
        # Bloquear cualquier acceso que venga a través de DuckDNS o dominios externos
        if ($host !~* "^(192\.168\.|localhost|127\.)") {
            return 404;
        }

        try_files $uri $uri/ /generarPassword/index.html =404;
    }

    # Servir archivos estáticos directamente con Nginx
    location / {
        try_files $uri $uri/ =404;
    }

    # Procesamiento de scripts PHP vía PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Prevenir acceso a archivos ocultos (ej: .editorconfig, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}


services:
  amule:
    image: ngosang/amule:latest
    container_name: amule
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - "GUI_PWD=${GUI_PWD}"
      - "WEBUI_PWD=${WEBUI_PWD}"
      - MOD_AUTO_RESTART_ENABLED=true
      - "MOD_AUTO_RESTART_CRON=0 6 * * *"
    ports:
      - "4711:4711"       # Web UI y REST API (amuleapi)
      - "4712:4712"       # Conexiones externas (amulegui/amulecmd)
      - "4662:4662"       # ED2K TCP cliente (necesario para ID Alta)
      - "4665:4665/udp"   # ED2K UDP servidor
      - "4672:4672/udp"   # Kademlia UDP
    volumes:
      - ./config:/home/amule/.aMule
      - ./downloads:/downloads

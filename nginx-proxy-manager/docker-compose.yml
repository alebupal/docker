services:
  app:
    container_name: nginx-proxy-manager
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '1000:81'
      - '443:443'
    volumes:
      - ${USER_HOME}/nginx-proxy-manager/data:/data
      - ${USER_HOME}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

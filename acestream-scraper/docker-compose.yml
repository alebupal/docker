services:
  acestream-scraper:
    image: pipepito/acestream-scraper:latest
    container_name: acestream-scraper
    hostname: acestream-scraper
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/Madrid
      - ENABLE_WARP=true
      - ENABLE_TOR=false
      - ENABLE_ACEXY=true
      - ENABLE_ACESTREAM_ENGINE=true
      - ACESTREAM_HTTP_PORT=6878
      - FLASK_PORT=8000
      - ACEXY_LISTEN_ADDR=:8080
      - ACEXY_HOST=localhost
      - ACEXY_PORT=6878
      - ALLOW_REMOTE_ACCESS=no
      - ACEXY_NO_RESPONSE_TIMEOUT=15s
      - ACEXY_BUFFER_SIZE=5MiB
      - ACESTREAM_HTTP_HOST=localhost
    ports:
      - "8008:8000"     # Web UI de AceStream Scraper (puerto 8008 en host)
      - "8086:8080"     # Proxy Acexy
      - "8621:8621"     # Puerto P2P Acestream
      - "43110:43110"   # ZeroNet UI (opcional)
      - "43111:43111"   # ZeroNet peer (opcional)
      - "26552:26552"   # ZeroNet peer (opcional)
    volumes:
      - ./data/config:/app/config
      - ./data/zeronet:/app/ZeroNet/data
